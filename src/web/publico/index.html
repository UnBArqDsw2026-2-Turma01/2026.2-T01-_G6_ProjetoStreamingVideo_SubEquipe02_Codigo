<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Entrega 3 - SubEquipe 02</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <header>
    <h1>Entrega 3 - SubEquipe 02</h1>
    <p>
      Espectador: <b id="saldo-espectador">0</b> moedas
      &nbsp;|&nbsp; Criador: <b id="saldo-criador">R$ 0,00</b>
      <button type="button" id="reiniciar">Reiniciar</button>
    </p>
  </header>

  <main>
    <div class="coluna">
      <section>
        <h2>Recarga (F1)</h2>
        <label>Pacote
          <select id="pacote"></select>
        </label>
        <p class="nota" id="composicao"></p>

        <label>Meio de pagamento
          <select id="meio"></select>
        </label>
        <p class="nota">Fora do ar: <span id="fora-do-ar"></span></p>

        <button type="button" id="comprar">Comprar</button>
        <p class="erro" id="erro-recarga" hidden></p>

        <div id="pedidos"></div>
      </section>

      <section>
        <h2>Doação (F2)</h2>
        <label>Canal
          <select id="canal"></select>
        </label>
        <label>Quantidade de moeda virtual
          <input id="quantidade" type="number" min="200" step="50" value="2000">
        </label>
        <p class="nota" id="faixa"></p>
        <label>Mensagem
          <textarea id="mensagem" rows="3"></textarea>
        </label>
        <p class="nota" id="contador"></p>
        <button type="button" id="doar">Doar</button>
        <p class="erro" id="erro-doacao" hidden></p>
      </section>
    </div>

    <section class="chat">
      <h2>Chat (F3)</h2>
      <ul id="fixadas"></ul>
      <ul id="mensagens"></ul>
      <form id="form-chat">
        <input id="texto-chat" type="text" maxlength="200" placeholder="Escreva uma mensagem" autocomplete="off">
        <button type="submit">Enviar</button>
      </form>
      <p class="erro" id="erro-chat" hidden></p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
